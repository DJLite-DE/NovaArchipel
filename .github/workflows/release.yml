name: Release

# Baut bei jedem Push auf main. Ist die Version in game/app.go neu,
# wird automatisch ein Release mit NovaArchipel.exe + Setup erstellt –
# den findet der Updater im Spiel.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version lesen
        id: ver
        run: |
          V=$(grep -oP 'const Version = "\K[^"]+' game/app.go)
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Spiel bauen
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w" -o NovaArchipel.exe ./cmd/nova
      - name: Installer bauen
        run: |
          cp NovaArchipel.exe cmd/setup/payload/
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w" -o NovaArchipel-Setup.exe ./cmd/setup
      - name: Release veröffentlichen
        if: steps.ver.outputs.exists == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" NovaArchipel.exe NovaArchipel-Setup.exe \
            --target "$GITHUB_SHA" --title "Nova Archipel ${TAG#v}" \
            --notes-file .github/release-notes.md --latest
