name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Spiel bauen
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w" -o NovaArchipel.exe ./cmd/nova
      - name: Installer bauen
        run: |
          cp NovaArchipel.exe cmd/setup/payload/
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w" -o NovaArchipel-Setup.exe ./cmd/setup
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" NovaArchipel.exe NovaArchipel-Setup.exe \
            --title "Nova Archipel ${TAG#v}" --notes-file .github/release-notes.md --latest
